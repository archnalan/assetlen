    <style>
        /* =========================================================
           ASSETLEN — bootstrap splash
           Shown only until the Blazor WASM bundle takes over.
           The tokens here MIRROR --al-* from app.css so the splash
           is consistent before the main bundle's tokens load.
           ========================================================= */
        :root {
            --splash-bg: #fafaf7;
            --splash-bg-elevated: #ffffff;
            --splash-text: #1a1d21;
            --splash-text-muted: #6b6f76;
            --splash-text-subtle: #9ca0a7;
            --splash-border: rgba(26, 29, 33, 0.08);
            --splash-border-strong: rgba(26, 29, 33, 0.14);
            --splash-accent: #c2542a;
            --splash-blueprint: #2f5d8c;
            --splash-blueprint-soft: #dde7f1;
            --splash-ease: cubic-bezier(0.2, 0, 0, 1);
            --splash-font-display: "Fraunces", "Inter Tight", "Segoe UI Variable", "Segoe UI", serif;
            --splash-font-body: "Inter", "Segoe UI Variable", "Segoe UI", sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --splash-bg: #15171a;
                --splash-bg-elevated: #1c1f23;
                --splash-text: #f0eee8;
                --splash-text-muted: #a5a8af;
                --splash-text-subtle: #6e7178;
                --splash-border: rgba(255, 255, 255, 0.08);
                --splash-border-strong: rgba(255, 255, 255, 0.14);
                --splash-accent: #d66948;
                --splash-blueprint: #5288c0;
                --splash-blueprint-soft: #1f3550;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--splash-bg);
            color: var(--splash-text);
            font-family: var(--splash-font-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        #app {
            min-height: 100vh;
        }

        /* Hide the splash once Blazor's root component has rendered. */
        body:has([b-blazor-ssr-end]) .al-splash,
        body.al-ready .al-splash {
            opacity: 0;
            pointer-events: none;
            transition: opacity 240ms var(--splash-ease);
        }

        .al-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--splash-bg);
            z-index: 1;
        }

        /* Hairline rule across the top — architectural reference */
        .al-splash__rule {
            height: 1px;
            background: var(--splash-border);
        }

        .al-splash__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px;
            gap: 16px;
        }

        .al-splash__brand {
            font-family: var(--splash-font-display);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--splash-text);
        }

        .al-splash__meta {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--splash-text-subtle);
            font-variant-numeric: tabular-nums;
        }

        .al-splash__stage {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            place-items: center;
            padding: 24px;
            min-height: 0;
        }

        .al-splash__panel {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Blueprint plot — SVG is animated by stroke-dashoffset */
        .al-blueprint {
            width: 100%;
            max-width: 320px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin-bottom: 28px;
        }

        .al-bp-grid line {
            stroke: var(--splash-border);
            stroke-width: 0.5;
        }

        .al-bp-plot line,
        .al-bp-plot polyline,
        .al-bp-plot path {
            fill: none;
            stroke: var(--splash-blueprint);
            stroke-width: 1.4;
            stroke-linejoin: round;
            stroke-linecap: round;
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: al-trace 2.4s var(--splash-ease) forwards;
        }

        .al-bp-plot line:nth-child(1)     { animation-delay: 0ms; }
        .al-bp-plot line:nth-child(2)     { animation-delay: 80ms; }
        .al-bp-plot line:nth-child(3)     { animation-delay: 160ms; }
        .al-bp-plot line:nth-child(4)     { animation-delay: 240ms; }
        .al-bp-plot polyline:nth-of-type(1)  { animation-delay: 360ms; }
        .al-bp-plot polyline:nth-of-type(2)  { animation-delay: 480ms; }
        .al-bp-plot path:nth-of-type(1)      { animation-delay: 640ms; }

        /* Compass dot — the focal point */
        .al-bp-dot {
            fill: var(--splash-accent);
            opacity: 0;
            animation: al-fade-in 480ms var(--splash-ease) 1100ms forwards;
        }

        .al-bp-dot-ring {
            fill: none;
            stroke: var(--splash-accent);
            stroke-width: 1.2;
            opacity: 0;
            transform-origin: 50% 50%;
            animation: al-pulse-ring 2.4s ease-out 1300ms infinite;
        }

        @keyframes al-trace {
            to { stroke-dashoffset: 0; }
        }

        @keyframes al-fade-in {
            to { opacity: 1; }
        }

        @keyframes al-pulse-ring {
            0%   { opacity: 0.6; transform: scale(0.6); }
            70%  { opacity: 0;   transform: scale(1.8); }
            100% { opacity: 0;   transform: scale(1.8); }
        }

        .al-splash__name {
            font-family: var(--splash-font-display);
            font-size: 44px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--splash-text);
            margin: 0;
            line-height: 1.1;
        }

        .al-splash__tagline {
            margin: 12px 0 28px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--splash-text-muted);
            max-width: 36ch;
        }

        /* Determinate-feeling progress that's actually loop-animated.
           Hairline rule with a terracotta sweep — calm not busy. */
        .al-splash__progress {
            width: 100%;
            max-width: 280px;
            height: 2px;
            background: var(--splash-border);
            border-radius: 1px;
            overflow: hidden;
            position: relative;
        }

        .al-splash__progress::after {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--splash-accent);
            transform-origin: left center;
            animation: al-progress 1.8s var(--splash-ease) infinite;
        }

        @keyframes al-progress {
            0%   { transform: translateX(-100%) scaleX(0.3); }
            50%  { transform: translateX(0%)    scaleX(0.6); }
            100% { transform: translateX(120%)  scaleX(0.3); }
        }

        .al-splash__status {
            margin-top: 14px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--splash-text-subtle);
            font-variant-numeric: tabular-nums;
        }

        .al-splash__bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            gap: 16px;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--splash-text-subtle);
        }

        .al-splash__bottom-spec {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        .al-splash__bottom-spec b {
            color: var(--splash-text-muted);
            font-weight: 600;
        }

        @media (max-width: 540px) {
            .al-splash__top { padding: 18px 20px; }
            .al-splash__bottom { padding: 16px 20px; flex-wrap: wrap; }
            .al-splash__name { font-size: 32px; }
            .al-splash__tagline { font-size: 14px; }
            .al-blueprint { max-width: 240px; margin-bottom: 20px; }
        }

        /* ─── Blazor error UI — calm, not catastrophic ──────────── */

        #blazor-error-ui {
            display: none;
            position: fixed;
            inset: auto 24px 24px 24px;
            max-width: 480px;
            margin-left: auto;
            background: var(--splash-bg-elevated);
            border: 1px solid var(--splash-border-strong);
            border-left: 3px solid var(--splash-accent);
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(26, 29, 33, 0.10);
            color: var(--splash-text);
            font-size: 14px;
            line-height: 1.5;
            z-index: 9999;
        }

        #blazor-error-ui .reload,
        #blazor-error-ui .dismiss {
            color: var(--splash-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin-right: 12px;
            cursor: pointer;
        }

        #blazor-error-ui .reload:hover,
        #blazor-error-ui .dismiss:hover {
            text-decoration: underline;
        }

        .blazor-error-boundary {
            background: var(--splash-bg-elevated);
            border: 1px solid var(--splash-border-strong);
            border-left: 3px solid var(--splash-accent);
            border-radius: 10px;
            color: var(--splash-text);
            padding: 16px 20px;
            margin: 16px;
        }

        .blazor-error-boundary::before {
            content: "Something didn't load. ";
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- ASSETLEN bootstrap splash — replaced by the Blazor root once the WASM bundle is live. -->
        <div class="al-splash" aria-hidden="true">
            <div class="al-splash__top">
                <div class="al-splash__brand">ASSETLEN</div>
                <div class="al-splash__meta">Architectural folio · v1.0</div>
            </div>
            <div class="al-splash__rule"></div>

            <div class="al-splash__stage">
                <div class="al-splash__panel">
                    <!-- Animated blueprint — a hairline grid behind a traced floor plan -->
                    <svg class="al-blueprint" viewBox="0 0 200 200" fill="none" role="img" aria-label="ASSETLEN architectural mark">
                        <!-- Background grid (static) -->
                        <g class="al-bp-grid">
                            <line x1="0"   y1="40"  x2="200" y2="40" />
                            <line x1="0"   y1="80"  x2="200" y2="80" />
                            <line x1="0"   y1="120" x2="200" y2="120" />
                            <line x1="0"   y1="160" x2="200" y2="160" />
                            <line x1="40"  y1="0"   x2="40"  y2="200" />
                            <line x1="80"  y1="0"   x2="80"  y2="200" />
                            <line x1="120" y1="0"   x2="120" y2="200" />
                            <line x1="160" y1="0"   x2="160" y2="200" />
                        </g>

                        <!-- Plot: an abstract floor plan traced in sequence -->
                        <g class="al-bp-plot">
                            <!-- Outer envelope (drawn first, edge by edge) -->
                            <line x1="30"  y1="40"  x2="170" y2="40" />
                            <line x1="170" y1="40"  x2="170" y2="160" />
                            <line x1="170" y1="160" x2="30"  y2="160" />
                            <line x1="30"  y1="160" x2="30"  y2="40" />

                            <!-- Interior partitions -->
                            <polyline points="30,100 100,100 100,40" />
                            <polyline points="100,100 170,100" />

                            <!-- A door swing / arc -->
                            <path d="M 100 100 A 18 18 0 0 1 118 118" />
                        </g>

                        <!-- Compass dot (accent) -->
                        <circle class="al-bp-dot-ring" cx="100" cy="100" r="14" />
                        <circle class="al-bp-dot" cx="100" cy="100" r="3.4" />
                    </svg>

                    <h1 class="al-splash__name">ASSETLEN</h1>
                    <p class="al-splash__tagline">
                        Real-estate project management — built for contractors who want to deliver the work, not the dashboard.
                    </p>

                    <div class="al-splash__progress" role="progressbar" aria-label="Loading application"></div>
                    <div class="al-splash__status">
                        <span id="al-splash-status-text">Loading workspace</span>
                    </div>
                </div>
            </div>

            <div class="al-splash__rule"></div>
            <div class="al-splash__bottom">
                <span class="al-splash__bottom-spec"><b>scale</b> mobile · tablet · desktop</span>
                <span class="al-splash__bottom-spec"><b>dwg</b> AL-001</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something didn't load.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" onclick="this.closest('#blazor-error-ui').style.display='none'">Dismiss</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mark the splash for removal once the Blazor root has mounted.
        // The CSS hides .al-splash when body.al-ready is set; this keeps
        // the splash a layout sibling instead of a child of #app, so the
        // transition out doesn't fight Blazor's hydration.
        (function () {
            var statusEl = document.getElementById('al-splash-status-text');
            var statuses = ['Loading workspace', 'Composing layout', 'Tracing baselines', 'Almost there'];
            var i = 0;
            var t = setInterval(function () {
                i = (i + 1) % statuses.length;
                if (statusEl) statusEl.textContent = statuses[i];
            }, 1800);

            // When Blazor renders into #app the splash is no longer the only child.
            var app = document.getElementById('app');
            if (!app) return;
            var observer = new MutationObserver(function () {
                var hasBlazorContent = Array.from(app.children).some(function (child) {
                    return !child.classList || !child.classList.contains('al-splash');
                });
                if (hasBlazorContent) {
                    document.body.classList.add('al-ready');
                    clearInterval(t);
                    observer.disconnect();
                    setTimeout(function () {
                        var splash = document.querySelector('.al-splash');
                        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    }, 320);
                }
            });
            observer.observe(app, { childList: true, subtree: false });
        })();
    </script>
</body>
