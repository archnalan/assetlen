<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Your development, held to what was agreed. Every price, date, specification and approval on the build — on the record, with the evidence attached and a name against it." />
    <title>ASSETLEN</title>
    <base href="/" />

    <!-- Icons. All generated from one geometry by tools/make-icons.mjs, which is
         the same geometry BrandMark.razor draws — so the tab, the home screen
         and the header can never drift apart. SVG is preferred where supported;
         the .ico carries pixel-grid 16/32/48 masters. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Fonts. Fraunces carries the display voice, Inter the body; both are
         preconnected because the first paint after the splash uses them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- The design system, then Blazor's scoped-CSS bundle. Nothing else.
         Bootstrap, Syncfusion, Radzen and the Fluent UI stylesheet used to load
         here; none of them are rendered by a single component any more, and
         between them they were four competing opinions about what a button is. -->
    <link rel="stylesheet" href="_content/assetlen.Shared/app.css" />
    <link href="assetlen.Maui.styles.css" rel="stylesheet" />

    <script src="customJavascript.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* ═════════════════════════════════════════════════════════════════
           Bootstrap splash — shown only until the WASM bundle takes over.

           It mirrors the --al-* tokens rather than importing them, because
           app.css has not necessarily arrived yet and a splash that flashes
           the wrong ground is worse than no splash. The mark drawn here is
           the same set square the app draws, traced in as it loads.
           ═════════════════════════════════════════════════════════════════ */
        :root {
            --sp-bg: #f6f5f1;
            --sp-text: #16191c;
            --sp-muted: #63676e;
            --sp-subtle: #8f949c;
            --sp-border: rgba(22, 25, 28, 0.10);
            --sp-accent: #c2542a;
            --sp-ease: cubic-bezier(0.2, 0, 0, 1);
            --sp-display: "Fraunces", "Inter Tight", "Segoe UI Variable", Georgia, serif;
            --sp-body: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --sp-bg: #131518;
                --sp-text: #eeece6;
                --sp-muted: #a3a7af;
                --sp-subtle: #6d727a;
                --sp-border: rgba(255, 255, 255, 0.09);
                --sp-accent: #dd7a58;
            }
        }

        :root[data-theme="dark"] {
            --sp-bg: #131518;
            --sp-text: #eeece6;
            --sp-muted: #a3a7af;
            --sp-subtle: #6d727a;
            --sp-border: rgba(255, 255, 255, 0.09);
            --sp-accent: #dd7a58;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--sp-bg);
            color: var(--sp-text);
            font-family: var(--sp-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app { min-height: 100dvh; }

        body.al-ready .splash {
            opacity: 0;
            pointer-events: none;
            transition: opacity 260ms var(--sp-ease);
        }

        .splash {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            background: var(--sp-bg);
        }

        .splash__rule { height: 1px; background: var(--sp-border); }

        .splash__top,
        .splash__bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
        }

        .splash__word {
            font-family: var(--sp-display);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .splash__spec {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--sp-subtle);
            font-variant-numeric: tabular-nums;
        }

        .splash__stage {
            flex: 1 1 auto;
            display: grid;
            place-items: center;
            padding: 24px;
            min-height: 0;
        }

        .splash__panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 30rem;
        }

        /* The mark, traced. Each stroke draws itself, then the node lands. */
        .splash__mark { width: 84px; height: 84px; margin-bottom: 26px; }

        .splash__mark path,
        .splash__mark line {
            fill: none;
            stroke: var(--sp-text);
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: splash-trace 1s var(--sp-ease) forwards;
        }

        .splash__mark line { opacity: 0.55; animation-delay: 480ms; }

        .splash__mark circle {
            fill: var(--sp-accent);
            opacity: 0;
            animation: splash-land 420ms var(--sp-ease) 820ms forwards;
        }

        @keyframes splash-trace { to { stroke-dashoffset: 0; } }
        @keyframes splash-land  { to { opacity: 1; } }

        .splash__claim {
            font-family: var(--sp-display);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin: 0;
        }

        /* Mirrors .auth__claim em on the login page: the accent lands on the
           three words the product is actually about. */
        .splash__claim em {
            font-style: italic;
            color: var(--sp-accent);
        }

        .splash__lede {
            margin: 10px 0 26px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--sp-muted);
            max-width: 34ch;
        }

        .splash__progress {
            width: min(240px, 60vw);
            height: 2px;
            background: var(--sp-border);
            border-radius: 1px;
            overflow: hidden;
            position: relative;
        }

        .splash__progress::after {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--sp-accent);
            transform-origin: left center;
            animation: splash-sweep 1.6s var(--sp-ease) infinite;
        }

        @keyframes splash-sweep {
            0%   { transform: translateX(-100%) scaleX(0.35); }
            50%  { transform: translateX(0%)    scaleX(0.6); }
            100% { transform: translateX(120%)  scaleX(0.35); }
        }

        .splash__status {
            margin-top: 14px;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--sp-subtle);
        }

        @media (max-width: 520px) {
            .splash__top, .splash__bottom { padding: 16px 18px; }
            .splash__claim { font-size: 19px; }
            .splash__mark { width: 68px; height: 68px; margin-bottom: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash__mark path,
            .splash__mark line { stroke-dashoffset: 0; animation: none; }
            .splash__mark circle { opacity: 1; animation: none; }
            .splash__progress::after { animation: none; transform: scaleX(0.5); }
        }

        /* Blazor's own error surface, in the product's voice. */
        #blazor-error-ui {
            display: none;
            position: fixed;
            inset: auto 20px 20px 20px;
            max-width: 30rem;
            margin-left: auto;
            background: var(--sp-bg);
            border: 1px solid var(--sp-border);
            border-left: 3px solid var(--sp-accent);
            border-radius: 6px;
            padding: 14px 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            color: var(--sp-text);
            font-size: 14px;
            z-index: 9999;
        }

        #blazor-error-ui .reload,
        #blazor-error-ui .dismiss {
            color: var(--sp-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin-right: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="splash" aria-hidden="true">
            <div class="splash__top">
                <span class="splash__word">ASSETLEN</span>
                <span class="splash__spec">DWG AL-001</span>
            </div>
            <div class="splash__rule"></div>

            <div class="splash__stage">
                <div class="splash__panel">
                    <svg class="splash__mark" viewBox="0 0 24 24" role="img" aria-label="ASSETLEN">
                        <path d="M3.2 20.2 12 3.8l8.8 16.4" stroke-width="2" />
                        <line x1="6.9" y1="14.6" x2="17.1" y2="14.6" stroke-width="1.9" />
                        <circle cx="12" cy="4.2" r="2.1" />
                    </svg>

                    <h1 class="splash__claim">
                        Your development,<br />
                        held to <em>what was agreed</em>.
                    </h1>
                    <p class="splash__lede">
                        On the record, with the evidence attached
                        and a name against it.
                    </p>

                    <div class="splash__progress" role="progressbar" aria-label="Loading"></div>
                    <div class="splash__status"><span id="splash-status">Opening the register</span></div>
                </div>
            </div>

            <div class="splash__rule"></div>
            <div class="splash__bottom">
                <span class="splash__spec">scale · mobile / tablet / desktop</span>
                <span class="splash__spec">rev 2</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something didn't load.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" onclick="this.closest('#blazor-error-ui').style.display='none'">Dismiss</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // Retire the splash once Blazor's root has actually rendered something.
        // Watching #app's children rather than using a timer means a slow first
        // load never shows a bare page, and a fast one never lingers.
        (function () {
            var statuses = ["Opening the register", "Resolving your projects", "Setting out the sheet"];
            var el = document.getElementById("splash-status");
            var i = 0;
            var tick = setInterval(function () {
                i = (i + 1) % statuses.length;
                if (el) el.textContent = statuses[i];
            }, 1700);

            var app = document.getElementById("app");
            if (!app) return;

            var observer = new MutationObserver(function () {
                var rendered = Array.prototype.some.call(app.children, function (child) {
                    return !child.classList || !child.classList.contains("splash");
                });
                if (!rendered) return;

                document.body.classList.add("al-ready");
                clearInterval(tick);
                observer.disconnect();

                setTimeout(function () {
                    var splash = document.querySelector(".splash");
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                }, 300);
            });

            observer.observe(app, { childList: true });
        })();
    </script>
</body>

</html>
